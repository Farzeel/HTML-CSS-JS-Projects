<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Income Tax Calculator</title>

  <link rel="stylesheet" href="style.css">

</head>
<body>

  <div class="container">
    <h1>💼 Income Tax Calculator</h1>

    <div class="input-group">
      <label for="income">Enter Your Annual Income ($):</label>
      <input type="number" id="income" placeholder="e.g. 50000">
    </div>

    <div class="input-group">
      <label for="age">Enter Your Age:</label>
      <input type="number" id="age" placeholder="e.g. 30">
    </div>

    <button id="calculateBtn">Calculate Tax</button>

    <div class="result" id="result">Your Tax: $0</div>
  </div>
  <script src="./script.js"></script>
</body>
</html>
