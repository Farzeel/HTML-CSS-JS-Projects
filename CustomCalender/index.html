<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Calendar</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="calendar-container">
        <button class="close-btn">&times;</button>
        
        <div class="header">
            <div class="icon">🕐</div>
            <div class="header-text">
                <h1>Event Calendar</h1>
                <p>Schedule your team meetings and events easily</p>
            </div>
        </div>

        <div class="content">
            <div class="calendar-section">
                <div class="month-nav">
                    <button id="prevMonth">‹</button>
                    <span id="monthYear">January 2025</span>
                    <button id="nextMonth">›</button>
                </div>

                <div class="weekdays">
                    <div class="weekday">MO</div>
                    <div class="weekday">TU</div>
                    <div class="weekday">WE</div>
                    <div class="weekday">TH</div>
                    <div class="weekday">FR</div>
                    <div class="weekday">SA</div>
                    <div class="weekday">SU</div>
                </div>

                <div class="days" id="calendarDays"></div>
            </div>

            <div class="form-section">
                <div class="form-group">
                    <label>Start date <span class="required">*</span></label>
                    <div class="input-row">
                        <input type="date" id="startDate" value="2025-01-15">
                        <input type="time" id="startTime" value="09:00">
                    </div>
                </div>

                <div class="form-group">
                    <label>End date <span class="required">*</span></label>
                    <div class="input-row">
                        <input type="date" id="endDate" value="2025-01-21">
                        <input type="time" id="endTime" value="09:00">
                    </div>
                </div>

                <div class="form-group">
                    <label>Maximum participants <span class="info-icon">i</span></label>
                    <input type="number" value="10" style="width: 100%;">
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="allDepts" checked>
                    <label for="allDepts">Open to all departments</label>
                </div>
            </div>
        </div>

        <div class="footer">
            <div class="range-text">
                Today . <span id="rangeDisplay">January 15, 2025 - January 21, 2025</span>
            </div>
            <div class="footer-buttons">
                <button class="btn btn-cancel">Cancel</button>
                <button class="btn btn-primary">Schedule meetings</button>
            </div>
        </div>
    </div>

    <script src="./script.js">
        
    </script>
</body>
</html>
