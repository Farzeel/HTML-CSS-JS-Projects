<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countdown Timer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="timer-container">
    <h1>Countdown Timer</h1>

    <input type="datetime-local" id="targetTime" />
    <button id="startBtn">Start Countdown</button>

    <div class="countdown">
      <div class="time-box">
        <span class="time" id="days">00</span>
        <span class="label">Days</span>
      </div>
      <div class="time-box">
        <span class="time" id="hours">00</span>
        <span class="label">Hours</span>
      </div>
      <div class="time-box">
        <span class="time" id="minutes">00</span>
        <span class="label">Minutes</span>
      </div>
      <div class="time-box">
        <span class="time" id="seconds">00</span>
        <span class="label">Seconds</span>
      </div>
    </div>
  </div>

    <script src="./script.js"></script>
</body>
</html>
